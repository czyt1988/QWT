# Markdown extensions
markdown_extensions:
  - meta
  - abbr
  - attr_list
  - def_list
  - footnotes
  - tables
  - md_in_html
  - toc:
      permalink: true
  - fenced_code
  - nl2br
  - pymdownx.caret
  - pymdownx.keys
  - pymdownx.mark
  - pymdownx.tilde
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.highlight:
      linenums: true
      linenums_style: table
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  # TeX math for the algorithm deep dives: $ ... $ inline, $$ ... $$
  # (arithmatex normalizes both to \( ... \) / \[ ... \) in the HTML,
  # which MathJax then typesets)
  - pymdownx.arithmatex:
      generic: true

# Custom CSS
extra_css:
  - stylesheets/extra.css

# MathJax renders the TeX formulas ( see docs/javascripts/mathjax.js )
extra_javascript:
  - javascripts/mathjax.js
  - https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js
