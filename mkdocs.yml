site_name: QWT - Qt Plotting Library
site_author: 'Chen ZongYan'
site_url: https://czyt1988.github.io/QWT
repo_url: https://github.com/czyt1988/QWT

# Multilingual site info
extra:
  site_name:
    en: QWT - Qt Plotting Library
    zh: QWT - Qt绘图库
  site_description:
    en: QWT is a powerful Qt plotting library that provides rich scientific and engineering chart drawing capabilities
    zh: QWT是一个功能强大的Qt绘图库，提供丰富的科学和工程图表绘制功能
  alternate:
    - name: English
      link: /QWT/
      lang: en
    - name: 中文
      link: /QWT/zh/
      lang: zh

# Theme
theme:
  name: material
  language: en
  palette:
    - scheme: default
      toggle:
        icon: material/brightness-4
        name: Switch to dark mode
    - scheme: slate
      toggle:
        icon: material/brightness-7
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.path
    - navigation.expand
    - navigation.indexes
    - navigation.footer
    - content.code.copy
    - content.code.annotate
    - search.suggest
    - search.highlight
    - search.share
    - toc.follow

# Plugins
plugins:
  - search
  - i18n:
      docs_structure: folder
